packages:
  - 'apps/*'
  - 'services/*'
  - 'tools/*'
  - 'libs/*'

# nx-go and Astro/Cloudflare native deps need their postinstall build scripts
# to run. pnpm v11 gates these behind allowBuilds (it replaced the removed
# onlyBuiltDependencies); anything left unreviewed fails install with
# ERR_PNPM_IGNORED_BUILDS under the default strictDepBuilds.
allowBuilds:
  esbuild: true
  nx: true
  sharp: true
  workerd: true

patchedDependencies:
  kysely@0.29.2: patches/kysely@0.29.2.patch

# drizzle-kit pulls the deprecated @esbuild-kit/core-utils, which pins esbuild
# 0.18.20 (GHSA-67mh-4wv8-2f99, dev-server CORS). Force the patched line; the
# transform API drizzle-kit uses is unchanged across these versions.
overrides:
  '@esbuild-kit/core-utils>esbuild': '>=0.25.0'
