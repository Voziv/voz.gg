packages:
  - 'apps/*'
  - 'services/*'
  - 'tools/*'
  - 'libs/*'

# nx-go and Astro/Cloudflare native deps need their postinstall build scripts
# to run. pnpm v11 gates these behind allowBuilds (it replaced the removed
# onlyBuiltDependencies); anything left unreviewed fails install with
# ERR_PNPM_IGNORED_BUILDS under the default strictDepBuilds.
allowBuilds:
  esbuild: true
  nx: true
  sharp: true
  workerd: true

# Force every esbuild copy to the patched line. <0.28.1 is vulnerable to a
# missing-binary-integrity-verification RCE (high) and a dev-server arbitrary
# file read on Windows (low). This also covers the deprecated
# @esbuild-kit/core-utils pulled in by drizzle-kit, whose transform API is
# unchanged across these versions.
overrides:
  esbuild: '>=0.28.1'
