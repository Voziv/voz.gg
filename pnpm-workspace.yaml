packages:
  - 'apps/*'
  - 'services/*'
  - 'tools/*'
  - 'libs/*'

allowBuilds:
  esbuild: set this to true or false
  nx: set this to true or false
  sharp: set this to true or false
  workerd: set this to true or false

# nx-go and Astro/Cloudflare native deps need their build scripts to run.
onlyBuiltDependencies:
  - esbuild
  - sharp
  - workerd
  - nx

patchedDependencies:
  kysely@0.29.2: patches/kysely@0.29.2.patch
