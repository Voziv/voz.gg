name: Deploy

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy affected Workers
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        # strictDepBuilds=false: pnpm 11 fails on ignored native build scripts in CI;
        # those deps ship prebuilt binaries via optional deps, so it's safe to skip.
        run: pnpm install --frozen-lockfile --config.strictDepBuilds=false

      - name: Cache nx
        uses: actions/cache@v4
        with:
          path: .nx/cache
          key: nx-deploy-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            nx-deploy-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            nx-deploy-${{ runner.os }}-

      - name: Derive nx SHAs
        uses: nrwl/nx-set-shas@v4

      - name: Deploy affected Workers
        run: pnpm exec nx affected -t deploy
