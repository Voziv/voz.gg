name: Deploy

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-main
  cancel-in-progress: false

permissions:
  contents: read
  actions: read # nx-set-shas reads prior workflow runs to derive the base SHA

jobs:
  deploy:
    name: Deploy affected Workers
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        # strictDepBuilds=false: pnpm 11 fails on ignored native build scripts in CI;
        # those deps ship prebuilt binaries via optional deps, so it's safe to skip.
        run: pnpm install --frozen-lockfile --config.strictDepBuilds=false

      - name: Cache nx
        uses: actions/cache@v5
        with:
          path: .nx/cache
          key: nx-deploy-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            nx-deploy-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            nx-deploy-${{ runner.os }}-

      - name: Derive nx SHAs
        uses: nrwl/nx-set-shas@v5

      # Apply D1 migrations BEFORE deploying new code. This ordering is only safe
      # because migrations are kept backward-compatible with the currently-running
      # code (expand/contract). Destructive schema changes must therefore be split
      # across separate deploys — see "Schema migrations" in AGENTS.md. Runs only
      # when an affected project defines a `migrate` target (today: web).
      - name: Apply D1 migrations (affected)
        run: pnpm exec nx affected -t migrate

      - name: Deploy affected Workers
        run: pnpm exec nx affected -t deploy
