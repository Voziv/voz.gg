name: CI

on:
  pull_request:
  push:
    branches-ignore:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read # nx-set-shas reads prior workflow runs to derive the base SHA

jobs:
  affected:
    name: Lint, test, build (affected)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      # Pinned to v5: setup-go@v6 breaks nx's Go project-graph inference in CI
      # (`nx affected` fails with "Failed to process project graph").
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true

      - name: Install dependencies
        # strictDepBuilds=false: native deps (esbuild/sharp/workerd/nx) ship prebuilt
        # binaries via optional deps; their ignored postinstall scripts are harmless,
        # but pnpm 11 treats ignored builds as a fatal error in CI without this.
        run: pnpm install --frozen-lockfile --config.strictDepBuilds=false

      - name: Cache nx
        uses: actions/cache@v5
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            nx-${{ runner.os }}-

      - name: Derive nx SHAs
        uses: nrwl/nx-set-shas@v5

      - name: Lint, test, build affected projects
        run: pnpm exec nx affected -t lint test build

      - name: Lint commit range
        if: github.event_name == 'pull_request'
        run: >-
          pnpm exec commitlint
          --from "${{ github.event.pull_request.base.sha }}"
          --to "${{ github.event.pull_request.head.sha }}"
          --verbose
