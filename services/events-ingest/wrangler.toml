name = "voz-gg-events-ingest"
main = "src/index.ts"
compatibility_date = "2026-05-28"
compatibility_flags = ["nodejs_compat"]

# Expose the ingest API on its own hostname. voz.gg is a Custom Domain on the web
# Worker, which captures the whole host, so ingest cannot share it via a path
# route — it gets a dedicated Custom Domain instead. Deploy provisions the cert
# and proxied DNS automatically (same zone). Agents receive this host as
# `ingestBaseUrl` in the enroll/config response and POST presence to it.
routes = [
  { pattern = "ingest.voz.gg", custom_domain = true },
]

[observability]
enabled = true

[[d1_databases]]
binding = "DB"
database_name = "voz-gg"
database_id = "845f9113-12a5-4911-8f0f-d96a9133bcc8"

[vars]
SITE_URL = "https://voz.gg"

[[queues.producers]]
binding = "NOTIFY_QUEUE"
queue = "voz-gg-notifications"

[[queues.consumers]]
queue = "voz-gg-notifications"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 3

[triggers]
crons = ["0 * * * *"]
